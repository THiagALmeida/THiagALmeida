name: Matrix profile

on:
  schedule:
    - cron: "17 9 * * *"   # todo dia (06:17 em Brasília)
  workflow_dispatch:        # botão "Run workflow" na aba Actions
  push:
    paths:
      - ".github/scripts/build_profile.py"
      - ".github/workflows/matrix-profile.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Gerar matrix-profile.svg
        run: python .github/scripts/build_profile.py matrix-profile.svg

      - name: Commit se mudou
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add matrix-profile.svg
          git diff --cached --quiet || (git commit -m "chore: atualiza matrix-profile.svg" && git push)
